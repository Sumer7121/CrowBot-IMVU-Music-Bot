name: CrowBot unit tests

on:
  push:
    branches:
      - crowbot-ai-v2
  workflow_dispatch:

jobs:
  python-unittest:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Qt headless system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-xkb1 libdbus-1-3
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 playwright
      - name: Compile Python source
        run: python -m compileall -q app bot config database music radio_server tests
      - name: Run CrowBot unittest suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
